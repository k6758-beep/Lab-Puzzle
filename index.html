<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>實驗室解謎</title>
<meta name="description" content="解開六間實驗室的謎題，找到四把鑰匙，打開正修大門。正修科大五專 116 學年度升學小遊戲。">
<meta name="theme-color" content="#0D2A2E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.65;font-size:17px;min-height:100%;color-scheme:var(--scheme,light)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:540px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:0 16px 32px}
#hud{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:8px 0;background:var(--hud,var(--bg))}
#prog{flex:1;min-width:0}
#prog .lab{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prog .bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:3px}
#prog .bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.hbtn{flex:none;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:5px 9px;font-size:12.5px;font-weight:700;line-height:1.25;color:var(--card-ink);text-align:center}
.hbtn b{display:block;font-size:17px;line-height:1.15}
.hbtn.pop{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.18)}}
#stage{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:6px}
.card{background:var(--card);color:var(--card-ink);border-radius:var(--r);padding:18px 16px;border:2px solid var(--line)}
h1{font-size:32px;line-height:1.25;font-weight:900;font-family:var(--display);text-wrap:balance}
h2{font-size:21px;line-height:1.35;font-weight:900;font-family:var(--display);margin-bottom:6px;text-wrap:balance}
h3{font-size:17px;font-weight:900;margin:14px 0 4px}
p+p{margin-top:8px}
.small{font-size:14.5px}.muted{color:var(--muted2)}
.kicker{font-size:14px;font-weight:900;color:var(--kick)}
.cta{display:block;width:100%;background:var(--pri);color:var(--pri-ink);font-weight:900;font-size:18px;padding:14px 16px;border-radius:var(--r);box-shadow:0 4px 0 var(--pri-d);text-align:center;text-decoration:none}
.cta:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pri-d)}
.cta[disabled]{opacity:.45;box-shadow:none;cursor:not-allowed}
.cta.ghost{background:var(--card);color:var(--card-ink);border:2px solid var(--line);box-shadow:none;font-size:16px;padding:11px 14px}
.cta.line{background:#06C755;color:#fff;box-shadow:0 4px 0 #04883a}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;background:var(--opt);color:var(--card-ink);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;font-weight:700;font-size:16.5px;line-height:1.45}
.opt>span:first-child{font-size:26px;flex:none}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);background:var(--sel)}
.opt.ok{border-color:#1FA37A;background:#E3F7EE;color:#0d3b2c}
.opt.no{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--sel);font-size:15.5px;font-weight:700;color:var(--card-ink)}
.tag{display:inline-block;font-size:13px;font-weight:900;padding:1px 9px;border-radius:99px;color:#fff;background:var(--c,#6B7785);white-space:nowrap}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;font-size:15.5px}
dl.kv dt{font-weight:900;white-space:nowrap}
ul.plain{padding-left:1.2em;font-size:15.5px}
.warn{background:#FFE600;color:#7A0025;border:3px solid #E6004C;border-radius:14px;padding:11px 13px;font-weight:900;font-size:16px;line-height:1.55}
.warn u{text-decoration-thickness:2px}
/* 報到 */
.avs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.av{aspect-ratio:1;border-radius:50%;border:3px solid var(--line);background:var(--c,#eee);display:grid;place-items:center;font-size:30px;overflow:hidden;padding:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av[aria-pressed=true]{border-color:var(--acc);box-shadow:0 0 0 4px var(--sel)}
.me{display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;background:var(--c,#eee);flex:none;border:3px solid #fff}
.me img{width:100%;height:100%;object-fit:cover}
input.name{width:100%;font:inherit;font-weight:700;padding:11px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;color:#14213D;margin-top:6px}
label.f{display:block;font-weight:900;font-size:15.5px;margin-top:12px}
/* 彈出視窗 */
#overlay{position:fixed;inset:0;z-index:20;background:rgba(10,16,40,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet,var(--card));color:var(--card-ink);width:100%;max-width:540px;max-height:88vh;max-height:88dvh;overflow:auto;border-radius:22px 22px 0 0;padding:8px 16px 26px;animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:8px;position:sticky;top:-8px;background:var(--sheet,var(--card));padding:10px 0 8px;z-index:1}
.sheet header h2{flex:1;margin:0}
.x{font-size:15px;font-weight:900;border:2px solid var(--line);border-radius:10px;padding:4px 12px;background:var(--opt)}
#toasts{position:fixed;left:0;right:0;bottom:18px;z-index:30;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{background:#14213D;color:#fff;font-weight:700;font-size:15px;padding:9px 16px;border-radius:99px;animation:up .25s;max-width:92%}
/* 關鍵時間 */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{font-size:14px;font-weight:900;padding:5px 12px;border-radius:99px;border:2px solid var(--c,var(--line));color:var(--card-ink);background:var(--opt)}
.chip[aria-pressed=true]{background:var(--c,#14213D);color:#fff}
.tl{list-style:none;padding:0;margin:10px 0 0 8px;border-left:4px solid var(--line)}
.tl li{position:relative;padding:0 0 14px 16px}
.tl li::before{content:"";position:absolute;left:-10px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--c,#6B7785);border:2px solid var(--card)}
.tl .mon{font-weight:900;font-size:15px;color:var(--muted2);padding-bottom:6px}
.tl .mon::before{display:none}
.tl .when{font-weight:900;font-size:16px;font-variant-numeric:tabular-nums}
.tl .what{font-weight:700}
.tl .past{opacity:.55}
.tl .quit .what{display:inline-block;background:#FFE600;color:#7A0025;border:2px solid #E6004C;border-radius:8px;padding:0 8px;font-weight:900}
.tl a.gc{display:inline-block;margin-top:3px;font-size:14px;font-weight:900;color:var(--link);text-decoration:underline}
.count{background:var(--sel);border-radius:12px;padding:10px 12px;font-weight:700;font-size:15.5px}
.disc{font-size:13px;color:var(--muted2);margin-top:10px}
/* 百寶袋 */
.bag{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.item{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:left;background:var(--opt);font-weight:900;font-size:15px;color:var(--card-ink);display:flex;gap:8px;align-items:center;line-height:1.3}
.item span{font-size:24px}
.item.lock{opacity:.5;border-style:dashed;font-weight:700}
.dl{border:2px solid var(--line);border-radius:14px;margin-top:8px;background:var(--opt);overflow:hidden}
.dl summary{font-weight:900;padding:10px 12px;cursor:pointer;border-left:8px solid var(--c)}
.dl .in{padding:4px 12px 12px;font-size:15.5px}
.steps4{display:grid;gap:6px;margin-top:8px;padding:0;list-style:none}
.steps4 li{display:flex;gap:8px;align-items:center;font-weight:700;font-size:15.5px;padding:8px 10px;border-radius:12px;border:2px solid var(--line);background:var(--opt)}
.steps4 li.on{border-color:var(--acc);background:var(--sel)}
.steps4 i{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:900}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}
.dlbox{border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0 10px;background:var(--opt)}
.dlgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.dlb{background:var(--c);color:#fff;border-radius:10px;padding:8px 4px;font-weight:900;font-size:15px;line-height:1.25}
.dlb small{display:block;font-weight:700;font-size:12px;opacity:.9}
.dlb.all{grid-column:1/-1;background:#14213D;padding:11px 4px;font-size:16px}
.multi .opt{position:relative;padding-right:40px}
.multi .opt[aria-pressed=true]{border-color:var(--acc);background:var(--sel)}
.multi .opt[aria-pressed=true]::after{content:"✓";position:absolute;right:10px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-size:15px;font-weight:900}
.remind{color:#7A2FE0;font-weight:900}
/* 版面想法：實驗大樓的藍圖。深青綠底加細格線，門牌和數字用工程字體，重點用琥珀色警示條。 */
:root{--font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;--display:var(--font);--num:"Chakra Petch","Noto Sans TC",sans-serif;--scheme:dark;
--bg:#0D2A2E;--ink:#E9FBF6;--card:#F3FBF8;--card-ink:#0F2F33;--line:#BFD9D3;--pri:#FFB627;--pri-ink:#0F2F33;--pri-d:#A66F00;
--acc:#19C3A6;--kick:#0B7D6B;--sel:#D9F6EF;--opt:#fff;--muted:#8FC0B8;--muted2:#48706A;--link:#0B63C4;--focus:#FFB627;--track:#1B4046;--r:16px}
body{background-image:linear-gradient(#ffffff0d 1px,transparent 1px),linear-gradient(90deg,#ffffff0d 1px,transparent 1px);background-size:26px 26px}
#hud{background:#0D2A2Ef2}
.tape{height:14px;background:repeating-linear-gradient(-45deg,#FFB627 0 14px,#0F2F33 14px 28px);border-radius:4px}
.cover{background:#123A40;color:var(--ink);border:2px solid #2C6A70}
.cover h1{font-size:38px;color:#fff}
.cover .no{font-family:var(--num);font-size:15px;letter-spacing:.2em;color:var(--pri);font-weight:700}
.doors{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.door{background:linear-gradient(#1a4a50,#12383d);border:3px solid var(--c);border-radius:12px 12px 4px 4px;padding:10px 6px 12px;text-align:center;color:#fff;position:relative;min-height:128px;display:flex;flex-direction:column;align-items:center;gap:2px}
.door .no{font-family:var(--num);font-weight:700;font-size:14px;background:var(--c);color:#fff;border-radius:6px;padding:0 8px}
.door .ic{font-size:34px;line-height:1.2}
.door .nm{font-weight:900;font-size:15px}
.door .st{font-size:12.5px;font-weight:700;color:var(--muted)}
.door::after{content:"";position:absolute;right:9px;top:54%;width:9px;height:9px;border-radius:50%;background:var(--pri)}
.door.done{background:#E9FBF6;color:#0F2F33}
.door.done .st{color:#0B7D6B}
.rack{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.slot{aspect-ratio:1;border-radius:12px;border:2px dashed #3d7c82;display:grid;place-items:center;font-size:22px;color:#3d7c82;padding:0;background:none}
.slot.on{border:2px solid var(--c,#FFB627);background:#fff;animation:pop .5s}
.pz{background:#0F2F33;border-radius:14px;padding:12px;margin-top:10px;color:#E9FBF6}
.pz svg{display:block;width:100%;height:auto}
.pick3{display:grid;gap:8px;margin-top:10px}
.pick3 button{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;font-weight:900;color:var(--card-ink);text-align:left}
.pick3 svg{width:170px}
.truck{font-size:30px;display:inline-block;animation:drive 1.6s ease-in-out forwards}
@keyframes drive{from{transform:translateX(-10px) scaleX(-1)}to{transform:translateX(210px) scaleX(-1)}}
.spin{animation:sp 2.4s linear infinite;transform-box:fill-box;transform-origin:center}
.spin.r{animation-direction:reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.sunrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}
.house{width:130px;height:130px;margin:10px auto;background:#F3FBF8;border:6px solid #8FC0B8;border-radius:8px;position:relative;transition:transform .35s;display:grid;place-items:center;color:#0F2F33;font-weight:900;font-size:15px}
.house::before{content:"";position:absolute;top:-6px;left:24px;right:24px;height:6px;background:#35A7FF;box-shadow:0 0 12px 3px #35A7FF}
.house span{transition:transform .35s}
.sun{font-size:44px;text-align:center;line-height:1.1}.sun small{display:block;font-size:13px;font-weight:700;color:var(--pri)}
.circ{display:grid;grid-template-columns:40px repeat(3,1fr) 40px;gap:4px;align-items:center}
.circ .end{font-size:28px;text-align:center}
.tile{aspect-ratio:1;background:#17454B;border:2px solid #2C6A70;border-radius:10px;padding:0}
.tile svg{transition:transform .2s}
.tile path{stroke:#6E9E99;stroke-width:14;fill:none;stroke-linecap:round}
.tile.live path{stroke:#FFD23F;filter:drop-shadow(0 0 4px #FFD23F)}
.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:260px;margin:6px auto}
.pad{aspect-ratio:1.5;border-radius:14px;background:var(--c);opacity:.35;border:3px solid #fff3;padding:0;transition:opacity .08s,transform .08s}
.pad.lit{opacity:1;transform:scale(1.05);box-shadow:0 0 18px var(--c)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:8px}
.dots i{width:12px;height:12px;border-radius:50%;background:#2C6A70}.dots i.on{background:var(--pri)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;max-width:240px;margin:0 auto}
.cell{aspect-ratio:1;background:#17454B;border-radius:8px;display:grid;place-items:center;font-size:28px}
.cell.wall{background:repeating-linear-gradient(45deg,#335a5f 0 6px,#274b50 6px 12px)}
.bot{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#FFB627;color:#0F2F33;font-size:22px;font-weight:900;transition:transform .2s}
.prog{display:flex;gap:5px;flex-wrap:wrap;min-height:38px;align-items:center;background:#17454B;border-radius:10px;padding:6px;margin-top:10px}
.prog span{background:#fff;color:#0F2F33;border-radius:8px;padding:2px 8px;font-weight:900;font-size:14px}
.prog em{font-style:normal;color:var(--muted);font-size:14px;padding-left:4px}
.cmds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.cmds button,.two button{background:var(--card);color:var(--card-ink);border:2px solid var(--line);border-radius:12px;padding:10px 4px;font-weight:900;font-size:15.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.two .go{background:var(--pri);border-color:var(--pri)}
.keycard{border-left:10px solid var(--c);background:#fff;border-radius:12px;padding:12px;margin-top:10px;font-size:15.5px;color:var(--card-ink)}
.pass{background:#fff;border:0;padding:0;overflow:hidden}
.pass .hd{background:#0F2F33;color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center}
.pass .hd .nm{font-size:24px;font-weight:900;line-height:1.2}
.pass .bd{padding:14px 16px}
.pass .time{font-family:var(--num);font-size:30px;font-weight:700;color:#0B7D6B}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.grid2 .opt{flex-direction:column;align-items:flex-start;gap:0;padding:10px 12px}
.grid2 .opt small{font-weight:700;color:var(--muted2);font-size:13px}
.pick3.col3{grid-template-columns:repeat(3,1fr)}
.pick3.col3 button{grid-template-columns:1fr;text-align:center;font-size:14.5px;padding:6px}
.pick3.col3 svg{width:100%}
.pick3 button.picked{background:#D9F6EF;border-color:#19C3A6}
.pick3 button:disabled{opacity:1}
.pick3 .ord{font-family:var(--num);font-size:22px;color:#0B7D6B;min-width:22px;text-align:center}
.segrow{display:grid;gap:4px;margin-top:10px;font-weight:900;font-size:15px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg2 button,.cmds button[aria-pressed]{background:#17454B;color:#E9FBF6;border:2px solid #2C6A70;border-radius:10px;padding:8px 4px;font-weight:700;font-size:15px}
.seg2 button[aria-pressed=true],.cmds button[aria-pressed=true]{background:#FFB627;color:#0F2F33;border-color:#FFB627;font-weight:900}
.folk{display:grid;gap:4px;font-size:15px;background:#17454B;border-radius:10px;padding:8px 10px;margin-top:6px}
.force{display:flex;gap:5px;align-items:center;margin-top:10px;font-weight:700;font-size:14.5px}
.force i{width:26px;height:14px;border-radius:4px;background:#2C6A70}.force i.on{background:#FF5C8A}
.cir2{display:grid;gap:8px;margin-top:6px}.cir2 b{font-size:14.5px;color:#FFB627}
.rule{background:#17454B;border-radius:12px;padding:12px;font-weight:900;font-size:17px;line-height:2.3;margin-top:8px}
.rule button{background:#FFB627;color:#0F2F33;border-radius:8px;padding:2px 10px;font-weight:900}
.tests{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.tests div{background:#17454B;border-radius:10px;padding:6px 2px;text-align:center;border:2px solid #19C3A6;display:grid;gap:1px;font-size:20px}
.tests div.ng{border-color:#FF5C8A}
.tests small{font-size:11.5px;color:#8FC0B8;font-weight:700}.tests b{font-size:13px}.tests em{font-style:normal;font-weight:900;color:#19C3A6}.tests .ng em{color:#FF5C8A}
</style>
</head>
<body>
<div id="app">
  <header id="hud" hidden>
    <button class="hbtn" id="btnBack" aria-label="上一步"><b>←</b>上一步</button>
    <div id="prog"></div>
    <button class="hbtn" id="btnTl" aria-label="關鍵時間"><b>🗓️</b>關鍵時間</button>
    <button class="hbtn" id="btnBag" aria-label="百寶袋"><b>🎒</b>百寶袋</button>
  </header>
  <main id="stage" aria-live="polite"></main>
</div>
<div id="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<noscript><p style="padding:20px">這個遊戲需要開啟 JavaScript 才能玩。</p></noscript>
<script>
"use strict";
/* =====================================================================
 *  資料層：每年只需要改這一段（學年度、日期、電話、LINE、獎學金、各科介紹）
 *  日期格式一律 "YYYY-MM-DD"（西元）。116 學年度 = 2027 年入學。
 *  來源：116學年度五專招生重要日程表
 * ===================================================================== */
const D = {
  cycle: "116學年度",
  school: { name: "正修科技大學", unit: "招生處", tel: "07-7310203", line: "https://line.me/R/ti/p/@csu1111", lineId: "@csu1111" },
  bonus: "經五專完全免試入學錄取正修並完成註冊，可獲得入學獎學金 5,000 元。",
  paths: {

let AC = null;
function beep(seq) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = "triangle"; o.frequency.value = f;
      g.gain.setValueAtTime(.07, t); g.gain.exponentialRampToValueAtTime(.001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d); t += d * .8; });
  } catch (e) {}
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const c = $("#fx"), g = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#FF5C8A", "#FFC93C", "#3DDBB4", "#5B8DEF", "#fff"];
  const P = Array.from({ length: 90 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, v: 2 + Math.random() * 4, w: 6 + Math.random() * 6, r: Math.random() * 6, c: cols[Math.random() * 5 | 0], s: Math.random() * 2 - 1 }));
  let n = 0;
  (function tick() {
    g.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.y += p.v; p.x += p.s; p.r += .1; g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); g.restore(); });
    if (++n < 170) requestAnimationFrame(tick); else g.clearRect(0, 0, c.width, c.height);
  })();
}

function pickPhoto(capture) {
  return new Promise(res => {
    const inp = document.createElement("input"); inp.type = "file"; inp.accept = "image/*"; if (capture) inp.setAttribute("capture", "user");
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if (!f) return res(null);
      const url = URL.createObjectURL(f), im = new Image();
      im.onload = () => {
        const c = document.createElement("canvas"), n = 240, s = Math.min(im.naturalWidth, im.naturalHeight); c.width = c.height = n;
        c.getContext("2d").drawImage(im, (im.naturalWidth - s) / 2, (im.naturalHeight - s) / 2, s, s, 0, 0, n, n);
        URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", .85));
      };
      im.onerror = () => { toast("這張照片打不開，換一張試試"); res(null); }; im.src = url;
    };
    inp.click();
  });
}

  return y;
}

function roomScene(k) {
  const R = ROOM[k], d = DEPT[k], qi = qAt(k), Q = R.qs[qi]; let fails = 0, done = false;
  stage(`<div class="card"><p class="kicker"><span style="font-family:var(--num)">${R.no}</span>｜${d.icon} ${R.lab}｜第 ${qi + 1} 題，共 2 題</p><h2>${Q.t}</h2><div class="pz" id="pz"></div><div id="fb"></div>
    <div class="two" id="help"><button id="hint">💡 給我提示</button><button id="leave">🚪 先回走廊</button></div></div><div id="after"></div>`);
  const finish = () => {
    if (done) return; done = true; $("#help").hidden = true;
    if (qi === 0) {
      good(); S.x.q[k] = 1; save();
      $("#fb").innerHTML = `<div class="hint">✅ 第 1 題解開了！${Q.why}</div>`;
      $("#after").innerHTML = `<button class="cta" id="ok">還有第 2 題，解開才有獎勵</button>`;
      $("#ok").onclick = () => go(S.step);
    } else {
      win(); confetti();
      const n = solved().length, r = REW[n]; solved().push(k); S.x.room = ""; save();
      give(r.key ? "k_" + r.key : "n_" + r.note);
      $("#fb").innerHTML = `<div class="hint">✅ 兩題都解開了！${Q.why}</div>`;
      $("#after").innerHTML = `<div class="card"><p class="kicker">認識這一間：${d.name}</p><p>${d.one}</p><dl class="kv"><dt>📖 學什麼</dt><dd>${d.learn}</dd><dt>🚀 未來職業</dt><dd>${d.jobs.join("、")}</dd></dl>${rewHTML(r)}</div>
        <button class="cta" id="ok">${n === 5 ? "六間都解開了！回走廊" : "回走廊，挑下一間"}</button>`;
      $("#ok").onclick = () => go(S.step);
    }
    $("#after").scrollIntoView({ block: "nearest", behavior: "smooth" });
  };
  const no = (msg, pic) => {
    if (done) return; bad(); fails++;
    $("#fb").innerHTML = `<div class="hint">💡 ${msg}${pic ? `<div style="margin-top:8px">${pic}</div>` : ""}</div>${fails >= 3 ? `<button class="cta ghost" id="skip" style="margin-top:8px">這題有點難，請學長姐幫我解開</button>` : ""}`;
    const s = $("#skip"); if (s) s.onclick = finish;
    $("#fb").scrollIntoView({ block: "nearest", behavior: "smooth" });
  };
  $("#hint").onclick = () => { $("#fb").innerHTML = `<div class="hint">💡 ${Q.hint}</div>`; };
  $("#leave").onclick = () => { S.x.room = ""; save(); go(S.step); };
  PZ[k][qi]($("#pz"), finish, no);
}

        rows: [["解謎成績", `6 間實驗室、12 題，${pad(mm)} 分 ${pad(ss)} 秒`], ["最想留下來", `正修科技大學五專部 ${d.name}`], ["學什麼", d.learn], ["未來", d.jobs.join("、")], ["第一把鑰匙", `早鳥直達（${D.paths.wan.name}）`]] });
      $("#fTl").onclick = () => openTimes("wan"); $("#fBag").onclick = openBag; $("#fAgain").onclick = () => { reset(); go(0); };
    } }
  ]
};

boot();
</script>
